server {
	listen 8888;
        # listen 443 reuseport ssl http2 backlog=1024 rcvbuf=64000 sndbuf=200000 fastopen=500;

	server_name app-dev.transmedic.co.id;	

        # Security headers
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
        # add_header X-Frame-Options DENY;
        # add_header X-Content-Type-Options nosniff;
        # add_header Content-Security-Policy "default-src 'self' www.google-analytics.com ajax.googleapis.com www.google.com google.com gstatic.com www.gstatic.com connect.facebook.net facebook.com;";
        # add_header X-XSS-Protection "1; mode=block";
        # add_header Referrer-Policy "origin";
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";
        # add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
        
        add_header X-Frame-Options SAMEORIGIN;        
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'OPTIONS, GET, POST, PUT, DELETE' always;
        add_header Referrer-Policy 'no-referrer' always;
        
        proxy_hide_header X-Powered-By;


        # limit_req zone=legit burst=50 nodelay;
        limit_req_status 444;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        index index.html index.php;

        # ssl_certificate /opt/ssl/default_blank.crt;
        # ssl_certificate_key /opt/ssl/default_blank.key;
	
	# location / {
        #       root /opt/rsud_gunungjati/frontend-v2/dist;  # Replace with your Vue.js build directory
        #       try_files $uri $uri/ /index.html;
        # }

	location / {
           proxy_pass  http://127.0.0.1:3332;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
	location /e-reservasi/ {
           proxy_pass  http://127.0.0.1:3333/;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
	
        location /kiosk/ {
           proxy_pass  http://127.0.0.1:3334/;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /viewer/ {
           proxy_pass  http://127.0.0.1:3335/;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

	location /socket.io/ {
                limit_req_status 444;
                proxy_http_version 1.1;
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_pass "http://127.0.0.1:3336";
        }
	    
        location ^~ /service {
                alias /opt/dev/rsud_malangbong/sc/backend/public;               
		try_files $uri $uri/ @laravelService;

                location ~ \.php {
                        include fastcgi_params;
                        fastcgi_param SCRIPT_FILENAME $request_filename;
                        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
                }
        }

        location @laravelService {
                rewrite /service/(.*)$ /service/index.php/$1 last;
        }
	
        location ^~ /antrian-bpjs {
                alias /opt/dev/rsud_malangbong/sc/backend/public;
                try_files $uri $uri/ @laravelServiceJKN;

                location ~ \.php {
                        include fastcgi_params;
                        fastcgi_param SCRIPT_FILENAME $request_filename;
                        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
                }
        }

        location @laravelServiceJKN {
                rewrite /antrian-bpjs/(.*)$ /antrian-bpjs/index.php/$1 last;
        }

	location /img/ {
               alias  /opt/dev/rsud_malangbong/sc/backend/public/img/;
               autoindex on;
        }

        location ^~ /eis {
                alias /opt/dev/rsud_malangbong/sc/eis/public;
                try_files $uri $uri/ @laravelEIS;

                location ~ \.php {
                        include fastcgi_params;
                        fastcgi_param SCRIPT_FILENAME $request_filename;
                        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
                }
        }

        location @laravelEIS {
                rewrite /eis/(.*)$ /eis/index.php?/$1 last;
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        location ~ /\.ht {
            deny  all;
        }

}

