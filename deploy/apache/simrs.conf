# =============================================================================
# deploy/apache/simrs.conf — satu pintu: http://localhost/simrs/ (Apache / XAMPP)
#
# Cara pakai (XAMPP di Windows):
#   1. Aktifkan modul di C:\xampp\apache\conf\httpd.conf (hapus tanda '#'):
#         LoadModule proxy_module          modules/mod_proxy.so
#         LoadModule proxy_http_module     modules/mod_proxy_http.so
#         LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#         LoadModule rewrite_module        modules/mod_rewrite.so
#   2. Salin berkas ini ke C:\xampp\apache\conf\extra\httpd-simrs.conf
#      lalu tambahkan di akhir httpd.conf:
#         Include conf/extra/httpd-simrs.conf
#   3. Sesuaikan folder SIMRS di bawah (contoh: C:/xampp/htdocs/simrs).
#   4. Restart Apache dari XAMPP Control Panel.
#
# Cara pakai (Linux, Debian/Ubuntu):
#   sudo cp deploy/apache/simrs.conf /etc/apache2/sites-available/simrs.conf
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo a2ensite simrs && sudo systemctl reload apache2
# =============================================================================

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    # ---------------------------------------------------------------------
    # Ubah dua baris ini sesuai lokasi hasil build di komputer Anda.
    # (Di Linux biasanya /var/www/simrs)
    # ---------------------------------------------------------------------
    Define SIMRS_ROOT "C:/xampp/htdocs/simrs"
    Define SIMRS_WWW  "C:/xampp/htdocs/simrs/www"

    DocumentRoot "${SIMRS_WWW}"
    <Directory "${SIMRS_WWW}">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # =====================================================================
    # 1) API + SOCKET (diteruskan ke service lokal)
    #    Blok <Location> diletakkan di atas blok Alias agar dipakai lebih dulu.
    # =====================================================================
    <Location "/simrs/service">
        ProxyPreserveHost On
        ProxyPass        "http://127.0.0.1:8000/service"
        ProxyPassReverse "http://127.0.0.1:8000/service"
    </Location>

    <Location "/simrs/api">
        ProxyPreserveHost On
        ProxyPass        "http://127.0.0.1:8000/api"
        ProxyPassReverse "http://127.0.0.1:8000/api"
    </Location>

    # Socket.IO memerlukan mod_proxy_wstunnel untuk WebSocket
    <Location "/simrs/socket.io">
        ProxyPreserveHost On
        ProxyPass        "ws://127.0.0.1:2530/socket.io"
        ProxyPassReverse "ws://127.0.0.1:2530/socket.io"
    </Location>

    <Location "/simrs/eis">
        ProxyPreserveHost On
        ProxyPass        "http://127.0.0.1:8001"
        ProxyPassReverse "http://127.0.0.1:8001"
    </Location>

    # =====================================================================
    # 2) SPA hasil build statis
    #    Bangun dulu (lihat INSTALL_DAN_JALANKAN.md Langkah 10):
    #      frontend-v2   : VITE_BASE_PATH=/simrs/ npm run build   → frontend-v2/dist
    #      viewer        : npx ng build --base-href /simrs/viewer/ --output-path dist/viewer
    #      kiosk         : npx ng build --base-href /simrs/kiosk/  --output-path dist/kiosk
    #      e-reservasi   : npx ng build --base-href /simrs/e-reservasi/ --output-path dist
    # =====================================================================
    Alias "/simrs/viewer"        "${SIMRS_ROOT}/viewer/dist/viewer"
    Alias "/simrs/kiosk"         "${SIMRS_ROOT}/kiosk/dist/kiosk"
    Alias "/simrs/e-reservasi"   "${SIMRS_ROOT}/e-reservasi/dist"
    Alias "/simrs"               "${SIMRS_ROOT}/frontend-v2/dist"

    <Directory "${SIMRS_ROOT}/viewer/dist/viewer">
        Require all granted
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /simrs/viewer/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /simrs/viewer/index.html [L]
        </IfModule>
    </Directory>

    <Directory "${SIMRS_ROOT}/kiosk/dist/kiosk">
        Require all granted
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /simrs/kiosk/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /simrs/kiosk/index.html [L]
        </IfModule>
    </Directory>

    <Directory "${SIMRS_ROOT}/e-reservasi/dist">
        Require all granted
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /simrs/e-reservasi/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /simrs/e-reservasi/index.html [L]
        </IfModule>
    </Directory>

    <Directory "${SIMRS_ROOT}/frontend-v2/dist">
        Require all granted
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /simrs/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /simrs/index.html [L]
        </IfModule>
    </Directory>

    # =====================================================================
    # 3) Statis berkas publik backend (unggahan lampiran/scan)
    # =====================================================================
    Alias "/simrs/uploads" "${SIMRS_ROOT}/backend/public"
    <Directory "${SIMRS_ROOT}/backend/public">
        Require all granted
    </Directory>

    ErrorLog  "logs/simrs-error.log"
    CustomLog "logs/simrs-access.log" combined
</VirtualHost>
