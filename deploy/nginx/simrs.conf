# =============================================================================
# deploy/nginx/simrs.conf — satu pintu: http://localhost/simrs/
#
# Cara pakai (Linux / macOS / WSL):
#   sudo cp deploy/nginx/simrs.conf /etc/nginx/conf.d/simrs.conf     # RHEL/Fedora
#   sudo cp deploy/nginx/simrs.conf /etc/nginx/sites-enabled/simrs.conf   # Debian/Ubuntu
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cara pakai (Windows + nginx.exe):
#   copy deploy\nginx\simrs.conf  C:\nginx\conf\conf.d\simrs.conf
#   lalu tambahkan di C:\nginx\conf\nginx.conf (di dalam blok http):
#       include conf.d/*.conf;
#   mulai/ulang: nginx.exe -s reload
#
# SEBELUM dipakai, ganti baris `root` di bawah agar sesuai lokasi repo Anda.
# =============================================================================

# --- WebSocket upgrade (wajib untuk socket.io & HMR) -------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name localhost 127.0.0.1;

    # Ganti dengan lokasi repo / hasil build di komputer Anda.
    #   Windows : C:/xampp/htdocs/simrs        (WAJIB memakai garis miring '/')
    #   Linux   : /var/www/simrs
    set $simrs_root /home/user/simrs;

    client_max_body_size 64m;          # unggah berkas/scan
    proxy_read_timeout   600s;         # laporan/PDF besar
    proxy_send_timeout   600s;
    proxy_connect_timeout 30s;

    # Akses & error log
    access_log /var/log/nginx/simrs.access.log;
    error_log  /var/log/nginx/simrs.error.log warn;

    # -------------------------------------------------------------------------
    # 0) Halaman depan: http://localhost/  →  daftar aplikasi
    #    (deploy/landing/index.html bersifat opsional, boleh diarahkan ke /simrs/)
    # -------------------------------------------------------------------------
    root $simrs_root/deploy/landing;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # -------------------------------------------------------------------------
    # 1) API backend Laravel  :  /simrs/service/*  →  127.0.0.1:8000/service/*
    #    Token dikirim lewat header `token` (lihat useApi.ts & JWTAuth.php).
    # -------------------------------------------------------------------------
    location /simrs/service/ {
        proxy_pass http://127.0.0.1:8000/service/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /simrs;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_buffering off;           # penting untuk streaming PDF/Excel
    }

    # Rute /api (biller/eksternal)
    location /simrs/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 2) Socket.IO (notifikasi realtime) : /simrs/socket.io/* → 127.0.0.1:2530
    # -------------------------------------------------------------------------
    location /simrs/socket.io/ {
        proxy_pass http://127.0.0.1:2530/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 7d;         # koneksi long-lived
        proxy_send_timeout 7d;
    }

    # -------------------------------------------------------------------------
    # 3) EIS / penampil EMR (Laravel 7, port 8001)
    # -------------------------------------------------------------------------
    location /simrs/eis/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /simrs/eis;
    }

    # -------------------------------------------------------------------------
    # 4) Aplikasi petugas (Vue 3 + Vite)  →  /simrs/
    #
    #    PRODUKSI (hasil `npm run build` dengan VITE_BASE_PATH=/simrs/):
    #        location /simrs/ { alias $simrs_root/frontend-v2/dist/; try_files ... }
    #
    #    DEVELOPMENT (Vite dev server di port 2222, HMR aktif):
    #        aktifkan blok proxy di bawah dan nonaktifkan blok statis.
    # -------------------------------------------------------------------------
    location /simrs/ {
        alias $simrs_root/frontend-v2/dist/;
        try_files $uri $uri/ /simrs/index.html;
        index index.html;
    }

    # --- Alternatif DEVELOPMENT: proxy ke Vite (port 2222) -------------------
    # location /simrs/ {
    #     proxy_pass http://127.0.0.1:2222;      # tanpa '/' di akhir → prefix dipertahankan
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host       $host;
    # }
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # 5) Viewer antrian / TV  →  /simrs/viewer/
    #    Build: cd viewer && npx ng build --base-href /simrs/viewer/ --output-path dist/viewer
    # -------------------------------------------------------------------------
    location /simrs/viewer/ {
        alias $simrs_root/viewer/dist/viewer/;
        try_files $uri $uri/ /simrs/viewer/index.html;
        index index.html;
    }

    # --- Alternatif DEVELOPMENT (ng serve --port 8202) -----------------------
    # location /simrs/viewer/ { proxy_pass http://127.0.0.1:8202; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # 6) Kiosk  →  /simrs/kiosk/
    #    Build: cd kiosk && npx ng build --base-href /simrs/kiosk/ --output-path dist/kiosk
    # -------------------------------------------------------------------------
    location /simrs/kiosk/ {
        alias $simrs_root/kiosk/dist/kiosk/;
        try_files $uri $uri/ /simrs/kiosk/index.html;
        index index.html;
    }

    # --- Alternatif DEVELOPMENT (ng serve --port 4200) -----------------------
    # location /simrs/kiosk/ { proxy_pass http://127.0.0.1:4200; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # 7) E-Reservasi  →  /simrs/e-reservasi/
    #    Build: cd e-reservasi && npx ng build --base-href /simrs/e-reservasi/ --output-path dist
    # -------------------------------------------------------------------------
    location /simrs/e-reservasi/ {
        alias $simrs_root/e-reservasi/dist/;
        try_files $uri $uri/ /simrs/e-reservasi/index.html;
        index index.html;
    }

    # --- Alternatif DEVELOPMENT (ng serve --port 4201) -----------------------
    # location /simrs/e-reservasi/ { proxy_pass http://127.0.0.1:4201; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # 8) Aplikasi PHP mandiri `tm/` (cetak EMR) — opsional.
    #    Jalankan: php -S 127.0.0.1:8090 -t tm
    # -------------------------------------------------------------------------
    # location /simrs/tm/ { proxy_pass http://127.0.0.1:8090/; proxy_set_header Host $host; }

    # -------------------------------------------------------------------------
    # 9) Statis: berkas unggahan / berkas publik backend (KTP, tanda tangan, dsb.)
    # -------------------------------------------------------------------------
    location /simrs/uploads/ {
        alias $simrs_root/backend/public/;
        autoindex off;
    }
}
