
<div class="header-navbar navbar navbar-expand-lg align-items-center navbar-shadow navbar-light floating-nav" style="background: white;

                style="display: flex; height: 100%;"><img style="object-fit: cover; height: 50px;"
                    src="assets/img/logo_only.png"><span
                    style="font-size: 18px; margin-left: 20px; font-weight: bold; display: flex; align-items: center;">
                    <div class="labels white--text" style="line-height: 1; align-self: center;">
                        <div class="labelrs">RSUD Bali Mandara</div>
                        <div class="sublabelrs">TRANSMEDIC</div>
                    </div>
                </span>
            </a>
        </div>
        <ul class="nav navbar-nav align-items-center ml-auto">
            <li class="nav-item d-none d-lg-block"><a type="button" class="nav-link nav-link-style btn"><span
                        class="ficon font-medium-5 feather icon-moon"></span></a></li>
            <li ngbdropdown="" class="nav-item dropdown-user">
                <span id="navbarUserDropdown" ngbdropdowntoggle="" aria-haspopup="true" aria-expanded="false"
                    class="dropdown-toggle nav-link dropdown-user-link">
                    <div class="user-nav d-sm-flex d-none">
                        <span class="user-name font-weight-bolder" [routerLink]="['/index']" pTooltip="Kembali"
                            style="cursor: pointer;">
                            <h5><span class="tanggal" style="background:rgba(234, 84, 85, 0.12); font-size: 1.3rem;">{{tgl}}</span>
                                <span class="jam" style="background:rgba(234, 84, 85, 0.12); font-size: 1.3rem;">{{jamSekarang}}</span></h5>

                        </span>

                    </div>

                </span>
            </li>
        </ul>
    </div>
</div>
<div class="app-content">
    <div class="p-col-12 p-lg-12">
        <div class="card" style="padding-top: 5px;">
            <div style="text-align: center;font-size: 25px;color: #3b3b3b;">Jadwal Operasi</div>
            <button (click)="exportToExcel()" style="margin-bottom: 10px;
            font-size: 1.1rem;
            border-radius: 10px;
            border-color: #017f14;
            border-style: solid;
            padding: 12px;
            color: #017f14;
            background-color: #ffffff;
            size: 20rem;
            "
            onmouseover="this.style.backgroundColor='#017f14'; this.style.color='#ffffff';"
            onmouseout="this.style.backgroundColor='#ffffff'; this.style.color='#017f14';"
            >Export to Excel</button>
            <p-table #dt [columns]="columnMenunggu" [value]="listmenunggu"
                styleClass="p-datatable-customers" [rowHover]="true"
                [showCurrentPageReport]="true"
                scrollable="true" [pageLinks]="5" 
                selectionMode="single">
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th *ngFor="let column of columns">
                            {{ column.header }}
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
                    <tr [ngClass]="getStatusClass(rowData.statusoperasi)" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex" [style.width]="column.width">
                        <td *ngFor="let column of columns">
                            {{ rowData[column.field]}}
                        
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns"
                    let-rowIndex="rowIndex">
                    <tr  [ngClass]="getStatusClass(rowData['statusoperasi'])" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex" >
                        <td *ngFor="let columnMenunggu of columns" >
                            {{rowData[columnMenunggu.field]}}
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>


    <div class="p-grid">
        <div class="p-col-12 p-lg-12">
            <div class="card">
                <div>
                    <div>
                        <h4 style="
                        text-align: center;
                        color:#060505;
                        font-size: bold;
                        ">Status Pasien</h4>
                    </div>
                </div> 
                <div style="display: flex; gap: 20rem;">
                    <p style="
                        background-color: #FFFF00;
                        color: #060505;
                        font-size: bold;
                        width: 20rem;
                        font-size: 20px;
                        text-align: center;
                        padding: 35px 0;
                        border-radius: 10px;
                    ">Menunggu Operasi</p>
                    <p style="
                        background-color: #017f14;
                        color: #f5f5f5 ;
                        font-size: bold;
                        width: 20rem;
                        font-size: 20px;
                        text-align: center;
                        padding: 35px 0;
                        border-radius: 10px;
                    ">Sedang Operasi</p>
                    <p style="
                        background-color: #1c017f;
                        color: #f5f5f5 ;
                        font-size: bold;
                        width: 20rem;
                        font-size: 20px;
                        text-align: center;
                        padding: 35px 0;
                        border-radius: 10px;
                    ">Selesai Operasi</p>
                    <p style="
                        background-color: #980909;
                        color: #f5f5f5 ;
                        font-size: bold;
                        width: 20rem;
                        font-size: 20px;
                        text-align: center;
                        padding: 35px 0;
                        border-radius: 10px;
                    ">Batal Operasi</p>
                </div>
                            </div>
            
        </div>
    </div>



</div>
